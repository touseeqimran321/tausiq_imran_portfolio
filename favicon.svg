<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
  <!-- Modern Monogram "TI" -->
  <g fill="url(#grad)">
    <!-- T top bar -->
    <rect x="14" y="18" width="22" height="5" rx="2.5" />
    <!-- T vertical stem -->
    <rect x="22.5" y="18" width="5" height="28" rx="2.5" />
    <!-- I vertical stem -->
    <rect x="42" y="18" width="5" height="28" rx="2.5" />
  </g>
  <!-- Subtle accent dot -->
  <circle cx="44.5" cy="13" r="2.5" fill="#38bdf8" />
</svg>
